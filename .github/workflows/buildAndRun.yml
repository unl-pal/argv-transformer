name: Build and Run

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - develop

jobs:
  build-and-test-on-all-OS:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 8
          distribution: zulu

      # intelligently finds, dls, uses, and caches correct version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # build and run with granularity for usability
      - name: Build
        run:
          ./gradlew clean build

      - name: Download
        run:
          ./gradlew download
      
      - name: Filter
        run:
          ./gradlew filter

      - name: Transform
        run:
          ./gradlew transform

