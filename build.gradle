plugins {
    id 'java'
    id 'application'
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'jvm-test-suite'
}

// rootProject.name = 'argv-transformer'
group = 'dev.arg-v.transformer'
version = '1.0.0'

    repositories {
        mavenCentral() // Most commonly used repository
        maven {
            url = uri('https://repo.eclipse.org/content/groups/releases/')
        } // Eclipse specific repo that cannot be found on maven central
    }
    // All External Dependencies from either repo
    dependencies {
        implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.12.2'
        implementation 'org.apache.commons:commons-csv:1.5'
        implementation 'commons-io:commons-io:2.16.1'
        implementation 'org.eclipse.core:contenttype:3.4.200-v20140207-1251'
        implementation 'org.eclipse.core:org.eclipse.core.resources:3.7.100'
        implementation 'org.eclipse.core:org.eclipse.core.runtime:3.7.0'
        implementation 'org.eclipse.equinox:org.eclipse.equinox.common:3.6.0.v20100503'
        implementation 'org.eclipse.platform:org.eclipse.core.jobs:3.8.0'
        implementation 'org.eclipse.platform:org.eclipse.equinox.preferences:3.6.1'
        implementation 'org.eclipse.osgi:org.eclipse.osgi:3.7.1'
        implementation 'org.eclipse.text:org.eclipse.text:3.5.101'
        implementation 'org.yaml:snakeyaml:2.0'
        implementation 'org.soot-oss:soot:4.6.0'
        testImplementation 'net.bytebuddy:byte-buddy:1.12.19'
        testImplementation 'net.bytebuddy:byte-buddy-agent:1.12.19'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:4.11.0'
        testImplementation 'org.objenesis:objenesis:3.3'
        testImplementation 'org.testng:testng:7.5.1' 
    }

// set run to run the entire program via driver
// Currently the full.Main does not handle transform, only download and filter
application {
    mainClass = 'full.Driver'
}

// This enforces java 8 compiance with the code
// also allows for the use of later compilers as long as the code conforms
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDirs = ['src/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test']
            // Exclude integrationExpected from test sources
            exclude 'integrationExpected/**'
        }
    }
}

tasks.named('compileJava') {
    group = "compile"
    description = """Compiles project
        Use -Djava.compiler.args='<args>' to set additional compiler args
            ex: '-Xlint:all'
        Use --rerun to force recompilation"""
    sourceSets.main.java.srcDirs = ['src/java']
    options.compilerArgs.addAll(System.getProperty("java.compiler.args")?.split() ?: [])
}

tasks.named('run') {
    group = 'execution'
}


tasks.named('test') {
	doFirst {
        println "Main classes: ${sourceSets.main.output.classesDirs.asPath}"
        println "Test classes: ${sourceSets.test.output.classesDirs.asPath}"
    }
    testLogging {
        events 'FAILED'
    }
    exclude '**/test/integrationExpected/**'
}

tasks.named('javadoc') {
}

// Custom Compile task used to run the individual parts from root
task('compile', type: JavaCompile) {
    source fileTree('src/java')
    classpath = configurations.runtimeClasspath
    destinationDirectory = file('build/classes/java')
    outputs.files(fileTree(destinationDirectory))
}

// Custom Test Compile task for use with test types other than unit tests
task('compileTest', type: JavaCompile) {
    dependsOn 'compileJava'
    source fileTree('src/java'), fileTree('src/test')
    classpath = configurations.runtimeClasspath + configurations.testRuntimeClasspath + files('build/classes/java/main')
    destinationDirectory = file('build/classes/java/test')
    outputs.files(fileTree(destinationDirectory))
}

// Custom task class used for creating tasks for individual parts of the code
class ExecOperationsTask extends DefaultTask {
    final org.gradle.process.ExecOperations execOperations

    @javax.inject.Inject
    ExecOperationsTask(org.gradle.process.ExecOperations execOperations) {
        this.execOperations = execOperations
    }
    //ExecOperations execOperations

    @TaskAction
    def execute() {
        println "ExecOp in task action: ${execOperations}"
    }

    @Internal
    ExecOperations getExecOperations() {
        return execOperations
    }
}

tasks.register('download', ExecOperationsTask) {
    group = 'execution'
    description = 'downloads the repos for database'
    dependsOn 'compileJava'
    doLast {
        println "Value of Exec: ${execOperations}"
        execOperations.javaexec {
            classpath = configurations.runtimeClasspath + files('build/classes/java/main')
            mainClass = 'download.Main'
            standardOutput = System.out
            errorOutput = System.err
        }
    }
}

// This is currently the same as 'run'
// Does not actually run the full application despite the name, only what is in Driver
tasks.register('full', ExecOperationsTask) {
    group = 'execution'
    description = 'Runs the compiled application'
    dependsOn 'download', 'filter', 'transform'
}

// Runs only the filter task
// Assumes that necesary folders already exist eg database
tasks.register('filter', ExecOperationsTask) {
    group = 'execution'
    description = 'Runs the filter'
    dependsOn 'compileJava'
    doLast {
        execOperations.javaexec {
            classpath = configurations.runtimeClasspath + files('build/classes/java/main')
            mainClass = 'filter.Main'
            standardOutput = System.out
            errorOutput = System.err
        }
    }
}

// Runs only the transform task
// Assumes that necessary folders already exist eg suitablePrgms
tasks.register('transform', ExecOperationsTask) {
    group = 'execution'
    description = 'Runs the transformer'
    dependsOn 'compileJava'
    doLast {
        execOperations.javaexec {
            classpath = configurations.runtimeClasspath + files('build/classes/java/main')
            mainClass = 'transform.Main'
            standardOutput = System.out
            errorOutput = System.err
        }
    }
}

// runs the transformer on the regression test cases in
// test/transformer/regression and generates fake benchmarks to the testOutput
// directory
tasks.register('regressionTransformer', ExecOperationsTask) {
    group = 'testing'
    description = 'Runs regression test for transformer'
    dependsOn 'compileJava'
    doLast {
        execOperations.javaexec {
            classpath = configurations.runtimeClasspath + files('build/classes/java/main')
            mainClass = 'transform.Main'
            args 'src/test/transformer/regression', 'testOutput'
            standardOutput = System.out
            errorOutput = System.err
        }
    }
}

// Wipes all folders created by the code as well as the build folder
// Use for fresh run of code
tasks.register('reset', Delete) {
    group = 'clean'
    description = 'Resets the program - deletes build, database, suitablePrgms and benchmarks'
    delete files('benchmarks', 'suitablePrgms', 'build', 'database')
    println 'Deleted Files'
}
