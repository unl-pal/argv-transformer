// set run to run the entire program via driver
application {
    //mainClass = 'download.Main'
    mainClass = 'full.Driver'
}

// This enforces java 8 compiance with the code
// also allows for the use of later compilers as long as the code conforms
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDirs = ['src/java/']
        }
    }
    test {
        java {
            srcDirs = ['test']
            // Exclude integrationExpected from test sources
            exclude 'integrationExpected/**'
        }
    }
}

tasks.named('compileJava') {
    group = "compile"
    description = """Compiles project
        Use -Djava.compiler.args='<args>' to set additional compiler args
            ex: '-Xlint:all'
        Use --rerun to force recompilation"""
    options.compilerArgs.addAll(System.getProperty("java.compiler.args")?.split() ?: [])
}

// Does not actually run the full application despite the name, only what is in Driver
tasks.named('run') {
    group = 'execution'
}

tasks.named('compileTestJava') {
    sourceSets.test.java.srcDirs = ['test']
}

tasks.named('testClasses') {
    sourceSets.test.java.srcDirs = ['build/classes/test']
}


tasks.named('test') {
    testLogging {
        events 'FAILED'
        exclude 'test/integrationExpected/**'
    }
}

tasks.named('javadoc') {
}

