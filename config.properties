# Properties for running the pipeline (download, filter, transform)

# --- Shared: read by more than one stage ---

# Expression type dial used by both filter and transform's suitability checks:
#   X = don't care, I = integer (int/short/byte/long), R = real (double/float),
#   S = string (String/char), B = boolean. Defaults to I if absent.
type=I

# --- download ---

# Path to a RepoReaper-style CSV of GitHub repository URLs + metadata
csv=dataset.csv
# How many projects to download
projectCount=200
# Upper/lower bounds on a project's lines of code for it to be downloaded
maxLoc=10000
minLoc=100
# Where download clones matching repos to
downloadDir=database
# Verbosity level for download's debug logging
debugLevel=2

# --- filter ---

# Minimum number of expressions, conditionals, params of/involving `type` required in a method
minExpr=1
minIfStmt=1
minParams=1
# Relaxes filter's suitability check when true: instead of requiring one method to
# individually meet minExpr/minIfStmt/minParams, sums those counts across the whole class.
# Currently ignores the `type` dial above entirely (counts expressions/conditionals/params
# of any type) rather than restricting to it.
simplifyFilter=false

# --- transform ---

# Enables debugging logs/features
debug=false
# Minimum number of type expressions/conditions/parameters required in the rewritten method
minTypeExpr=1
minTypeCond=1
minTypeParams=1
# Transform all code regardless of whether it already compiles
transformAll=true
